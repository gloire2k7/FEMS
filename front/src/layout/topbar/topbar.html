<div class="flex justify-between items-center gap-4 py-3 px-4 md:px-6 border-b border-slate-200/80 bg-white/90 backdrop-blur-sm shrink-0 z-20">
  <div class="flex items-center gap-3 min-w-0">
    <button type="button" (click)="sidebar.toggleMobile()"
      class="lg:hidden w-9 h-9 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>
    <div class="hidden sm:block">
      <p class="text-[10px] font-bold text-teal-600 uppercase tracking-widest leading-none">FEMS Portal</p>
      <p class="text-sm font-semibold text-slate-700 truncate">Fire Extinguisher Management</p>
    </div>
  </div>

  <div class="flex items-center gap-1.5 ml-auto">
    <a routerLink="/place-order"
      class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
      <i data-lucide="shopping-cart" class="w-4 h-4"></i>
      <span class="hidden md:inline">Shop</span>
    </a>
    <a routerLink="/my-orders"
      class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
      <i data-lucide="package" class="w-4 h-4"></i>
      <span class="hidden md:inline">Orders</span>
    </a>
    <a routerLink="/notifications" title="Notifications"
      class="relative w-9 h-9 rounded-lg border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-50 transition-colors">
      <i data-lucide="bell" class="w-4 h-4"></i>
      <span *ngIf="unreadCount > 0"
        class="absolute -top-1 -right-1 min-w-[1.125rem] h-[1.125rem] px-0.5 rounded-full bg-[#8C1D24] text-white text-[10px] font-bold flex items-center justify-center">
        {{ unreadCount > 9 ? '9+' : unreadCount }}
      </span>
    </a>
    <a routerLink="/settings" title="Settings"
      class="w-9 h-9 rounded-lg border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-50 transition-colors">
      <i data-lucide="settings" class="w-4 h-4"></i>
    </a>
  </div>
</div>
