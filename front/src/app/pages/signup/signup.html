<!-- FEMS Sign Up -->
<div class="auth-page">
  <div class="auth-card auth-card--tall">

    <div class="auth-visual">
      <div class="auth-visual-inner">
        <a routerLink="/" class="auth-brand">
          <div class="auth-brand-icon">
            <img src="assets/logo.png" alt="FEMS" class="w-4 h-4 brightness-0 invert object-contain" />
          </div>
          <div>
            <span class="auth-brand-name">FEMS</span>
            <span class="auth-brand-tag">Fire Safety Platform</span>
          </div>
        </a>

        <div class="auth-visual-body">
          <h1 class="auth-visual-title">Create your company<br/>workspace in minutes.</h1>
          <p class="auth-visual-desc">Register, verify your email, and start managing fire safety compliance.</p>
        </div>

        <div class="auth-steps">
          <div class="auth-step auth-step--active"><span>1</span><p>Register</p></div>
          <div class="auth-step"><span>2</span><p>Verify</p></div>
          <div class="auth-step"><span>3</span><p>Go live</p></div>
        </div>
      </div>
    </div>

    <div class="auth-form-panel auth-form-panel--scroll">
      <div class="auth-form-wrap">
        <div class="auth-form-header">
          <h2>Create account</h2>
          <p>Fill in your company details to get started.</p>
        </div>

        <div *ngIf="error" class="auth-alert auth-alert--error">{{ error }}</div>

        <form (submit)="onSubmit()" class="auth-form">
          <div class="auth-form-grid">
            <div class="auth-field">
              <label>Your name</label>
              <input type="text" name="name" [(ngModel)]="name" placeholder="John" required />
            </div>
            <div class="auth-field">
              <label>Company name</label>
              <input type="text" name="company_name" [(ngModel)]="company_name" placeholder="Acme Corp" required />
            </div>
          </div>
          <div class="auth-field">
            <label>Email address</label>
            <input type="email" name="email" [(ngModel)]="email" placeholder="you@company.com" required />
          </div>
          <div class="auth-form-grid">
            <div class="auth-field">
              <label>Phone</label>
              <input type="text" name="phone" [(ngModel)]="phone" placeholder="+1 555 000 0000" required />
            </div>
            <div class="auth-field">
              <label>Address</label>
              <input type="text" name="address" [(ngModel)]="address" placeholder="123 Facility Way" required />
            </div>
          </div>
          <button type="submit" [disabled]="isLoading" class="auth-btn-primary">
            {{ isLoading ? 'Creating account…' : 'Create account' }}
          </button>
        </form>

        <p class="auth-footer-link">
          Already have an account?
          <a routerLink="/signin">Sign in</a>
        </p>
      </div>
    </div>

  </div>
</div>
